<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#120a05" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--head-meta-->
  </head>
  <body>
    <div id="stage" class="stage" style="background-image: url('%POSTER%')" aria-hidden="true"></div>
    <div class="scrim" aria-hidden="true"></div>

    <a class="skip" href="#main-nav">Skip to menu</a>

    <header class="hud hud--top">
      <p class="tagline" id="tagline"></p>
      <nav class="menu" id="main-nav" aria-label="Main">
        <ul id="menu"></ul>
      </nav>
    </header>

    <main class="hud hud--bottom">
      <h1 class="artist" id="artist"><!--artist--></h1>
      <div class="meta">
        <ul class="slides-nav" id="slides-nav" aria-label="Videos" hidden></ul>
        <button type="button" class="ui-btn" id="unmute" aria-pressed="false" hidden>Unmute</button>
        <p class="clock" aria-label="Local time"><span id="clock-time"></span><span class="clock__sep" aria-hidden="true"> · </span><span id="clock-date"></span></p>
      </div>
    </main>

    <button type="button" class="play-btn" id="play-btn" hidden aria-label="Play video">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M7 4.5v15l13-7.5z" fill="currentColor" /></svg>
      <span>Play</span>
    </button>

    <div id="overlays"></div>
    <!--noscript-->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
